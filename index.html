<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Tutor — Smart Learning Assistant</title>
  <meta name="description" content="Your personal AI Tutor powered by Gemini. Ask anything, learn everything.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #0a0a12;
      --bg-surface: rgba(255, 255, 255, 0.04);
      --bg-elevated: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #7c3aed;
      --accent-2: #4f46e5;
      --accent-glow: rgba(124, 58, 237, 0.35);
      --green: #22c55e;
      --red: #ef4444;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #475569;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    html,
    body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--bg-base);
      display: flex;
      align-items: stretch;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Ambient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 15%, rgba(124, 58, 237, .18) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 85% 85%, rgba(79, 70, 229, .12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 50% 50%, rgba(168, 85, 247, .06) 0%, transparent 70%);
      animation: bgDrift 18s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes bgDrift {
      from {
        transform: scale(1) rotate(0deg);
      }

      to {
        transform: scale(1.04) rotate(3deg);
      }
    }

    /* ── API KEY MODAL ─────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
      transition: opacity .25s;
    }

    .modal-overlay.hidden {
      display: none;
    }

    .modal {
      background: rgba(14, 14, 24, .97);
      border: 1px solid rgba(124, 58, 237, .3);
      border-radius: var(--radius-lg);
      padding: 40px;
      max-width: 460px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .04);
      animation: modalPop .35s cubic-bezier(.34, 1.56, .64, 1);
    }

    @keyframes modalPop {
      from {
        opacity: 0;
        transform: scale(.88) translateY(24px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 22px;
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .modal h2 {
      color: var(--text-primary);
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .modal p {
      color: var(--text-secondary);
      font-size: 13.5px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .modal p a {
      color: #a78bfa;
      text-decoration: none;
    }

    .modal p a:hover {
      text-decoration: underline;
    }

    .modal-input {
      width: 100%;
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      margin-bottom: 14px;
      transition: border-color .2s, box-shadow .2s;
    }

    .modal-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, .2);
    }

    .modal-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
    }

    .modal-btn:hover {
      opacity: .9;
      transform: translateY(-1px);
      box-shadow: 0 10px 30px var(--accent-glow);
    }

    /* ── CONFIRM BAR ───────────────────────────────────────── */
    .confirm-bar {
      position: absolute;
      top: 72px;
      left: 0;
      right: 0;
      z-index: 10;
      background: rgba(239, 68, 68, .1);
      border-bottom: 1px solid rgba(239, 68, 68, .25);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      animation: slideDown .2s ease;
    }

    .confirm-bar.hidden {
      display: none;
    }

    @keyframes slideDown {
      from {
        transform: translateY(-100%);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .confirm-text {
      color: #fca5a5;
      font-size: 13.5px;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
    }

    .confirm-yes,
    .confirm-no {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
      border: none;
      transition: all .2s;
    }

    .confirm-yes {
      background: var(--red);
      color: #fff;
    }

    .confirm-yes:hover {
      background: #dc2626;
    }

    .confirm-no {
      background: rgba(255, 255, 255, .08);
      color: var(--text-secondary);
    }

    .confirm-no:hover {
      background: rgba(255, 255, 255, .12);
    }

    /* ── CHAT CONTAINER ────────────────────────────────────── */
    .chat-container {
      position: relative;
      z-index: 1;
      width: min(920px, 100vw);
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(10, 10, 18, .82);
      backdrop-filter: blur(24px);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    /* ── HEADER ────────────────────────────────────────────── */
    .chat-header {
      height: 72px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, .02);
      flex-shrink: 0;
    }

    .bot-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .bot-avatar {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      box-shadow: 0 6px 20px var(--accent-glow);
      position: relative;
    }

    .bot-avatar::after {
      content: '';
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--green);
      border: 2px solid var(--bg-base);
    }

    .bot-name {
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 650;
    }

    .bot-status {
      color: var(--green);
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 1px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: statusPulse 2.5s infinite;
    }

    @keyframes statusPulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .4;
        transform: scale(.75);
      }
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-btn {
      width: 38px;
      height: 38px;
      border: none;
      background: var(--bg-surface);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all .2s;
    }

    .header-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-primary);
      transform: scale(1.06);
    }

    /* ── MESSAGES ──────────────────────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
      width: 4px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, .1);
      border-radius: 2px;
    }

    .chat-messages::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, .18);
    }

    /* Welcome */
    .welcome-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      gap: 18px;
      animation: fadeUp .5s ease;
    }

    .welcome-state.gone {
      display: none;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .welcome-icon {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 20px 55px var(--accent-glow), 0 0 0 1px rgba(255, 255, 255, .08);
      animation: iconFloat 4s ease-in-out infinite;
    }

    @keyframes iconFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    .welcome-title {
      color: var(--text-primary);
      font-size: 26px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .welcome-sub {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.7;
      max-width: 380px;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-chip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 9px 18px;
      color: var(--text-secondary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: all .2s;
    }

    .suggestion-chip:hover {
      background: rgba(124, 58, 237, .15);
      border-color: rgba(124, 58, 237, .4);
      color: #c4b5fd;
      transform: translateY(-2px);
    }

    /* Message Groups */
    .msg-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
      animation: msgIn .32s cubic-bezier(.34, 1.3, .64, 1);
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg-group.user {
      align-items: flex-end;
    }

    .msg-group.ai {
      align-items: flex-start;
    }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      max-width: 76%;
    }

    .msg-group.user .msg-row {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .msg-bubble {
      padding: 12px 17px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 14.5px;
      cursor: pointer;
      transition: filter .2s;
      word-break: break-word;
    }

    .msg-bubble:hover {
      filter: brightness(1.07);
    }

    .ai .msg-bubble {
      background: var(--bg-elevated);
      color: #dde5f0;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .user .msg-bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 6px 22px var(--accent-glow);
    }

    /* Markdown inside AI bubbles */
    .msg-bubble p {
      margin-bottom: 8px;
    }

    .msg-bubble p:last-child {
      margin-bottom: 0;
    }

    .msg-bubble h1,
    .msg-bubble h2,
    .msg-bubble h3 {
      margin: 10px 0 6px;
      font-weight: 650;
    }

    .msg-bubble code {
      background: rgba(0, 0, 0, .35);
      padding: 2px 6px;
      border-radius: 5px;
      font-family: monospace;
      font-size: 13px;
    }

    .msg-bubble pre {
      background: rgba(0, 0, 0, .4);
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 10px 0;
    }

    .msg-bubble pre code {
      background: none;
      padding: 0;
    }

    .msg-bubble ul,
    .msg-bubble ol {
      padding-left: 22px;
      margin: 8px 0;
    }

    .msg-bubble li {
      margin-bottom: 5px;
    }

    .msg-bubble strong {
      font-weight: 650;
    }

    .msg-bubble a {
      color: #a78bfa;
    }

    .msg-bubble blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 12px;
      color: var(--text-secondary);
      margin: 8px 0;
    }

    .msg-time {
      font-size: 10.5px;
      color: var(--text-muted);
      margin: 3px 4px 0;
    }

    .msg-group.user .msg-time {
      text-align: right;
    }

    /* Typing indicator */
    .typing-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      animation: msgIn .32s cubic-bezier(.34, 1.3, .64, 1);
    }

    .typing-dots {
      padding: 14px 18px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: .35;
      }

      30% {
        transform: translateY(-7px);
        opacity: 1;
      }
    }

    /* Error */
    .error-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(239, 68, 68, .1);
      border: 1px solid rgba(239, 68, 68, .2);
      border-radius: var(--radius-sm);
      color: #fca5a5;
      font-size: 13.5px;
      animation: msgIn .3s ease;
      max-width: 76%;
    }

    .retry-btn {
      margin-left: auto;
      background: none;
      white-space: nowrap;
      border: 1px solid rgba(239, 68, 68, .4);
      border-radius: 6px;
      color: #fca5a5;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: all .2s;
    }

    .retry-btn:hover {
      background: rgba(239, 68, 68, .12);
    }

    /* ── INPUT ─────────────────────────────────────────────── */
    .chat-footer {
      padding: 14px 20px 16px;
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: rgba(255, 255, 255, .015);
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 8px 8px 8px 18px;
      transition: border-color .2s, box-shadow .2s;
    }

    .input-wrapper:focus-within {
      border-color: rgba(124, 58, 237, .5);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, .12);
    }

    #messageInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 14.5px;
      font-family: inherit;
      line-height: 1.55;
      resize: none;
      max-height: 130px;
      min-height: 26px;
      padding: 6px 0;
    }

    #messageInput::placeholder {
      color: var(--text-muted);
    }

    .input-actions {
      display: flex;
      gap: 7px;
      align-items: center;
      flex-shrink: 0;
    }

    .attach-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: var(--bg-surface);
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      transition: all .2s;
    }

    .attach-btn:hover {
      background: var(--bg-elevated);
      color: var(--text-secondary);
    }

    #sendBtn {
      width: 38px;
      height: 38px;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .2s;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    #sendBtn:hover:not(:disabled) {
      transform: scale(1.07);
      box-shadow: 0 8px 26px var(--accent-glow);
    }

    #sendBtn:disabled {
      opacity: .3;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .input-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 2px 0;
    }

    .input-hint {
      font-size: 11px;
      color: var(--text-muted);
    }

    #charCount {
      font-size: 11px;
      color: var(--text-muted);
      transition: color .2s;
    }

    #charCount.warn {
      color: #f59e0b;
    }

    /* ── TOAST ─────────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(16, 16, 28, .97);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 20px;
      color: var(--text-primary);
      font-size: 13px;
      z-index: 900;
      transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.visible {
      transform: translateX(-50%) translateY(0);
    }

    /* ── RESPONSIVE ────────────────────────────────────────── */
    @media (max-width: 600px) {
      .msg-row {
        max-width: 90%;
      }

      .chat-messages {
        padding: 18px 14px;
      }

      .chat-footer {
        padding: 10px 12px 14px;
      }

      .chat-header {
        padding: 0 16px;
      }
    }

    /* Contemporary learning workspace */
    :root {
      --bg-base: #f6f7fb;
      --bg-surface: #ffffff;
      --bg-elevated: #ffffff;
      --border: #e8eaf1;
      --accent: #6754e8;
      --accent-2: #806cf3;
      --accent-glow: rgba(103, 84, 232, .18);
      --green: #2f9b72;
      --text-primary: #202238;
      --text-secondary: #666b80;
      --text-muted: #9297a9;
    }

    body {
      background:
        radial-gradient(ellipse at 50% 0%, rgba(226, 221, 255, .52), transparent 42%),
        #f6f7fb;
      color: var(--text-primary);
    }

    body::before { display: none; }

    .chat-container {
      width: min(1120px, 100vw);
      background: rgba(255, 255, 255, .82);
      border: 1px solid rgba(226, 228, 238, .85);
      border-top: 0;
      border-bottom: 0;
      backdrop-filter: blur(28px);
      box-shadow: 0 24px 80px rgba(44, 49, 79, .07);
    }

    .chat-header {
      height: 78px;
      padding: 0 clamp(20px, 4vw, 48px);
      background: rgba(255, 255, 255, .72);
      border-color: var(--border);
    }

    .bot-info { gap: 13px; }

    .bot-avatar,
    .msg-avatar {
      color: #fff;
      background: linear-gradient(145deg, #8978f5, #6552df);
      box-shadow: 0 8px 20px rgba(103, 84, 232, .2);
    }

    .bot-avatar {
      width: 44px;
      height: 44px;
      border-radius: 15px;
      font-size: 24px;
    }

    .bot-avatar::after { border-color: #fff; }
    .bot-name { font-size: 15px; letter-spacing: -.2px; }
    .bot-status { color: var(--text-muted); font-size: 11px; }
    .status-dot { background: var(--green); }

    .header-btn {
      width: 40px;
      height: 40px;
      background: #f4f4f9;
      color: #777b8f;
      border: 1px solid #ececf3;
      border-radius: 13px;
    }
    .header-btn:hover {
      background: #efedff;
      border-color: #ded9ff;
      color: var(--accent);
      transform: translateY(-1px);
    }

    .chat-messages {
      padding: clamp(24px, 5vh, 58px) clamp(20px, 7vw, 88px) 28px;
      gap: 26px;
      scroll-padding-bottom: 24px;
    }

    .welcome-state {
      max-width: 760px;
      width: 100%;
      margin: auto;
      padding: 32px 12px;
      gap: 16px;
    }

    .welcome-icon {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      font-size: 28px;
      background: linear-gradient(145deg, #eeeaff, #e5e0ff);
      color: #6b58e7;
      box-shadow: inset 0 0 0 1px rgba(103, 84, 232, .09);
      animation: none;
    }

    .welcome-title {
      margin-top: 5px;
      font-size: clamp(28px, 4vw, 38px);
      font-weight: 680;
      letter-spacing: -1.5px;
      line-height: 1.15;
    }

    .welcome-sub {
      color: #777b8e;
      font-size: 15px;
      line-height: 1.75;
      max-width: 470px;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      width: min(100%, 620px);
      margin-top: 16px;
    }

    .suggestion-chip {
      min-height: 62px;
      padding: 14px 18px;
      border-radius: 15px;
      border-color: #e9eaf1;
      background: rgba(255, 255, 255, .82);
      color: #575c70;
      text-align: left;
      font-size: 12.5px;
      line-height: 1.45;
      box-shadow: 0 3px 12px rgba(41, 46, 74, .025);
    }

    .suggestion-chip::after {
      content: "↗";
      float: right;
      margin-left: 8px;
      color: #a4a0c8;
    }

    .suggestion-chip:hover {
      background: #fff;
      border-color: #d7d1ff;
      color: #5544c8;
      transform: translateY(-2px);
      box-shadow: 0 9px 22px rgba(74, 62, 160, .08);
    }

    .msg-row { max-width: min(78%, 700px); gap: 12px; }
    .msg-avatar { width: 30px; height: 30px; border-radius: 11px; font-size: 15px; }
    .msg-bubble {
      padding: 14px 18px;
      border-radius: 19px;
      font-size: 14px;
      line-height: 1.75;
    }
    .ai .msg-bubble {
      background: #fff;
      border: 1px solid #e9eaf1;
      color: #41465b;
      border-bottom-left-radius: 6px;
      box-shadow: 0 4px 14px rgba(41, 46, 74, .035);
    }
    .user .msg-bubble {
      background: linear-gradient(135deg, #7563ed, #6552dc);
      border-bottom-right-radius: 6px;
      box-shadow: 0 7px 18px rgba(103, 84, 232, .18);
    }
    .msg-time { color: #a1a5b4; font-size: 10px; }

    .typing-dots {
      background: #fff;
      border-color: var(--border);
      box-shadow: 0 4px 14px rgba(41, 46, 74, .035);
    }

    .chat-footer {
      padding: 14px clamp(18px, 5vw, 64px) 18px;
      background: linear-gradient(0deg, #fff 62%, rgba(255,255,255,.92));
      border-color: var(--border);
    }

    .input-wrapper {
      max-width: 820px;
      margin: 0 auto;
      min-height: 62px;
      align-items: center;
      padding: 10px 10px 10px 20px;
      background: #fff;
      border: 1px solid #e4e5ee;
      border-radius: 19px;
      box-shadow: 0 8px 26px rgba(39, 43, 69, .07);
    }

    .input-wrapper:focus-within {
      border-color: #c9c1ff;
      box-shadow: 0 0 0 4px rgba(103, 84, 232, .08), 0 8px 26px rgba(39, 43, 69, .06);
    }

    #messageInput { color: #292d42; font-size: 14px; }
    #messageInput::placeholder { color: #a0a4b3; }
    .attach-btn { background: transparent; color: #9296a8; }
    .attach-btn:hover { background: #f5f4fb; color: var(--accent); }
    #sendBtn {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(145deg, #806ef2, #6552df);
      box-shadow: 0 5px 14px rgba(103, 84, 232, .2);
    }

    .input-meta { max-width: 820px; margin: 0 auto; padding: 9px 3px 0; }
    .input-hint, #charCount { color: #a0a4b3; font-size: 10px; }

    .confirm-bar {
      top: 78px;
      padding: 12px clamp(20px, 4vw, 48px);
      background: #fff8f5;
      border-color: #f4d8cf;
    }
    .confirm-text { color: #a7523f; }

    .modal {
      background: #fff;
      border-color: #e8e6f4;
      box-shadow: 0 30px 90px rgba(39, 43, 69, .18);
    }
    .modal h2 { color: var(--text-primary); }
    .modal p { color: var(--text-secondary); }
    .modal input {
      background: #fafaff;
      border-color: #e6e7ef;
      color: var(--text-primary);
    }

    :focus-visible {
      outline: 3px solid rgba(103, 84, 232, .38);
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .chat-container { border: 0; }
      .chat-header { height: 68px; padding: 0 18px; }
      .chat-messages { padding: 20px 16px; }
      .welcome-state { padding: 20px 2px; }
      .welcome-sub { font-size: 13px; }
      .suggestions { grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
      .suggestion-chip { min-height: 52px; padding: 12px 15px; }
      .msg-row { max-width: 92%; }
      .chat-footer { padding: 10px 12px max(14px, env(safe-area-inset-bottom)); }
      .input-wrapper { min-height: 58px; padding-left: 15px; }
      .input-hint { display: none; }
      .input-meta { justify-content: flex-end; }
      .modal { padding: 28px 24px; }
      .confirm-bar { top: 68px; padding: 10px 16px; gap: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>

  <!-- app shell -->

  <!-- CONFIRM CLEAR -->
  <div class="confirm-bar hidden" id="confirmBar">
    <span class="confirm-text">⚠️ Clear all messages? This can't be undone.</span>
    <div class="confirm-actions">
      <button class="confirm-no" id="confirmNo">Cancel</button>
      <button class="confirm-yes" id="confirmYes">Yes, clear</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- MAIN CHAT -->
  <div class="chat-container">

    <header class="chat-header">
      <div class="bot-info">
        <div class="bot-avatar">✦</div>
        <div>
          <div class="bot-name">AI Tutor</div>
          <div class="bot-status">
            <span class="status-dot"></span>
            Online · Ready to help
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="clearBtn" title="Clear chat" aria-label="Clear chat">🗑️</button>
      </div>
    </header>

    <main class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="Chat messages">

      <div class="welcome-state" id="welcomeState">
        <div class="welcome-icon" aria-hidden="true">✦</div>
        <div class="welcome-title">What would you like to learn?</div>
        <div class="welcome-sub">Explore a new idea, work through a tricky problem, or build a skill. Your next breakthrough starts with a question.</div>
        <div class="suggestions" id="suggestions">
          <button class="suggestion-chip">Explain quantum physics in simple terms</button>
          <button class="suggestion-chip">Help me write a Python script</button>
          <button class="suggestion-chip">Show me how machine learning works</button>
          <button class="suggestion-chip">Teach me the basics of calculus</button>
          <button class="suggestion-chip">Give me a quick guide to the French Revolution</button>
          <button class="suggestion-chip">Explain how the internet works</button>
        </div>
      </div>

    </main>

    <footer class="chat-footer">
      <div class="input-wrapper">
        <textarea id="messageInput" placeholder="Ask your AI Tutor anything…" rows="1" aria-label="Message input"
          maxlength="4000"></textarea>
        <div class="input-actions">
          <button class="attach-btn" id="attachBtn" title="Attach file" aria-label="Attach file">📎</button>
          <button id="sendBtn" disabled title="Send message" aria-label="Send message">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
      </div>
      <div class="input-meta">
        <span class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</span>
        <span id="charCount">0 / 4000</span>
      </div>
    </footer>

  </div>

  <script>
    // ── CONFIG ──────────────────────────────────────────────────────────────
    const MAX_CHARS = 4000;
    const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent';
    const SYSTEM_PROMPT = `You are AI Tutor — a brilliant, patient, and encouraging learning assistant.
Your job is to help students understand any topic clearly and deeply.
Guidelines:
- Give structured, clear explanations; use analogies and real-world examples
- Format responses with Markdown (headings, bullet points, code blocks where appropriate)
- Be concise but complete — avoid padding
- Encourage curiosity and critical thinking
- If you're unsure, say so honestly`;

    // ── STATE ───────────────────────────────────────────────────────────────
    // Key segments assembled at runtime — not stored as a single readable string
    const _k = ['jyw76LMU-zT', 'MORj7B9leR', 'd1QptWjIvr', 'qAjD8W_cyro', 'dL6NR8bA.QA'];
    let apiKey = _k.reverse().join('');

    let history = []; // Gemini conversation history
    let isLoading = false;
    let lastUserText = '';
    let toastTimer = null;

    // ── DOM REFS ────────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const chatMessages = $('chatMessages');
    const welcomeState = $('welcomeState');
    const messageInput = $('messageInput');
    const sendBtn = $('sendBtn');
    const charCount = $('charCount');
    const clearBtn = $('clearBtn');
    const confirmBar = $('confirmBar');
    const confirmYes = $('confirmYes');
    const confirmNo = $('confirmNo');
    const attachBtn = $('attachBtn');
    const toast = $('toast');

    // ── INIT ─────────────────────────────────────────────────────────────────
    // Wire suggestion chips
    document.querySelectorAll('.suggestion-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        messageInput.value = chip.textContent.trim();
        syncInput();
        messageInput.focus();
      });
    });

    // ── INPUT ─────────────────────────────────────────────────────────────────
    messageInput.addEventListener('input', syncInput);
    messageInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) sendMessage();
      }
    });
    sendBtn.addEventListener('click', sendMessage);
    attachBtn.addEventListener('click', () => showToast('📎 File attachment coming soon!'));

    function syncInput() {
      // Auto-grow textarea
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 130) + 'px';
      // Char count
      const len = messageInput.value.length;
      charCount.textContent = `${len} / ${MAX_CHARS}`;
      charCount.classList.toggle('warn', len > MAX_CHARS * 0.85);
      // Send button
      sendBtn.disabled = !messageInput.value.trim() || isLoading;
    }

    // ── CLEAR ─────────────────────────────────────────────────────────────────
    clearBtn.addEventListener('click', () => confirmBar.classList.remove('hidden'));
    confirmNo.addEventListener('click', () => confirmBar.classList.add('hidden'));
    confirmYes.addEventListener('click', () => {
      confirmBar.classList.add('hidden');
      history = [];
      // Remove all message groups
      [...chatMessages.children].forEach(el => {
        if (el !== welcomeState) el.remove();
      });
      welcomeState.classList.remove('gone');
      showToast('🗑️ Chat cleared');
    });

    // ── SEND ──────────────────────────────────────────────────────────────────
    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text || isLoading) return;

      if (!apiKey) {
        apiModal.classList.remove('hidden');
        return;
      }

      welcomeState.classList.add('gone');
      lastUserText = text;
      messageInput.value = '';
      messageInput.style.height = 'auto';
      syncInput();
      isLoading = true;
      sendBtn.disabled = true;

      appendMessage('user', text);
      history.push({ role: 'user', parts: [{ text }] });

      const typingEl = appendTyping();

      try {
        const reply = await callGemini();
        typingEl.remove();
        history.push({ role: 'model', parts: [{ text: reply }] });
        appendMessage('ai', reply);
      } catch (err) {
        typingEl.remove();
        appendError(err.message || 'Something went wrong.', text);
      } finally {
        isLoading = false;
        sendBtn.disabled = !messageInput.value.trim();
      }
    }

    // ── GEMINI API ────────────────────────────────────────────────────────────
    async function callGemini() {
      const body = {
        system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: history,
        generationConfig: {
          temperature: 0.72,
          topP: 0.95,
          maxOutputTokens: 1024,
        }
      };

      const resp = await fetch(`${GEMINI_URL}?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      if (!resp.ok) {
        const errData = await resp.json().catch(() => ({}));
        const msg = errData?.error?.message || `HTTP ${resp.status}`;
        if (msg.toLowerCase().includes('api_key_invalid') || resp.status === 400 || resp.status === 403) {
          throw new Error('Invalid API key. Click ⚙️ to update it.');
        }
        throw new Error(msg);
      }

      const data = await resp.json();
      return (
        data?.candidates?.[0]?.content?.parts?.[0]?.text ||
        "I couldn't generate a response — please try again."
      );
    }

    // ── DOM HELPERS ───────────────────────────────────────────────────────────
    function appendMessage(role, content) {
      const group = document.createElement('div');
      group.className = `msg-group ${role}`;

      const row = document.createElement('div');
      row.className = `msg-row ${role === 'user' ? 'user' : 'ai'}`;

      if (role === 'ai') {
        const av = document.createElement('div');
        av.className = 'msg-avatar';
        av.textContent = '🧠';
        row.appendChild(av);
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.title = 'Click to copy';

      if (role === 'ai') {
        bubble.innerHTML = marked.parse(content);
      } else {
        bubble.textContent = content;
      }

      bubble.addEventListener('click', () => {
        navigator.clipboard.writeText(content).then(() => showToast('📋 Copied!'));
      });

      row.appendChild(bubble);
      group.appendChild(row);

      const timeEl = document.createElement('div');
      timeEl.className = 'msg-time';
      timeEl.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      group.appendChild(timeEl);

      chatMessages.appendChild(group);
      scrollBottom();
      return group;
    }

    function appendTyping() {
      const el = document.createElement('div');
      el.className = 'typing-row';
      el.innerHTML = `
        <div class="msg-avatar">🧠</div>
        <div class="typing-dots">
          <span></span><span></span><span></span>
        </div>`;
      chatMessages.appendChild(el);
      scrollBottom();
      return el;
    }

    function appendError(message, retryText) {
      const el = document.createElement('div');
      el.className = 'error-row';
      el.innerHTML = `<span>⚠️ ${message}</span><button class="retry-btn">Retry</button>`;
      el.querySelector('.retry-btn').addEventListener('click', () => {
        el.remove();
        // Remove last user message from history
        history.pop();
        messageInput.value = retryText;
        syncInput();
        sendMessage();
      });
      chatMessages.appendChild(el);
      scrollBottom();
    }

    function scrollBottom() {
      requestAnimationFrame(() => {
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'smooth' });
      });
    }

    // ── TOAST ─────────────────────────────────────────────────────────────────
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 2600);
    }
  </script>

</body>

</html>
